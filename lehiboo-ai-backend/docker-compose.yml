version: '3.8'

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Le Hiboo AI Backend - Docker Compose
# Configuration pour Plesk Docker Proxy
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PostgreSQL Database
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  postgres:
    image: postgres:16-alpine
    container_name: lehiboo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lehiboo}
      POSTGRES_USER: ${POSTGRES_USER:-lehiboo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lehiboo_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"  # Port externe 5433 pour éviter conflit
    networks:
      - lehiboo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lehiboo} -d ${POSTGRES_DB:-lehiboo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Backend Node.js
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: lehiboo-ai-backend:1.0.0
    container_name: lehiboo-ai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    # Port mapping
    # Format: HOST:CONTAINER
    # Le port 3000 du container sera mappé sur le port 3004 de l'hôte
    # Plesk Docker Proxy utilisera ce port pour router le trafic
    ports:
      - "3004:3000"

    # Variables d'environnement
    # IMPORTANT: Remplacez ces valeurs par vos vraies clés API !
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info

      # API Keys (À CONFIGURER)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-api-key}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-your-weather-api-key}
      API_KEY: ${API_KEY:-your-api-key}
      WORDPRESS_API_KEY: ${WORDPRESS_API_KEY:-your-wordpress-api-key}

      # WordPress
      WORDPRESS_URL: ${WORDPRESS_URL:-https://lehiboo.dilios.me}
      WORDPRESS_API_URL: ${WORDPRESS_API_URL:-https://lehiboo.dilios.me/wp-json}

      # OpenAI (gpt-4o-mini ~16x moins cher)
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-20}

      # PostgreSQL
      DATABASE_URL: postgres://${POSTGRES_USER:-lehiboo}:${POSTGRES_PASSWORD:-lehiboo_secret_2024}@postgres:5432/${POSTGRES_DB:-lehiboo}

    # Fichier .env (recommandé pour sécurité)
    # Créez un fichier .env.production avec vos vraies valeurs
    env_file:
      - .env.production

    # Volumes pour persistance des logs
    volumes:
      - ./logs:/app/logs
      - ./src/prompts:/app/src/prompts:ro  # Read-only pour les prompts

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Ressources (ajustez selon votre serveur)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Réseau
    networks:
      - lehiboo-network

    # Labels pour Plesk Docker Proxy
    # Plesk utilise ces labels pour configurer le reverse proxy
    labels:
      # Nom du service
      - "com.docker.compose.service=backend"

      # Configuration Traefik (si Plesk utilise Traefik)
      - "traefik.enable=true"
      - "traefik.http.routers.lehiboo-ai.rule=Host(`preprod.lehiboo.com/api-planner/`)"
      - "traefik.http.routers.lehiboo-ai.entrypoints=websecure"
      - "traefik.http.routers.lehiboo-ai.tls.certresolver=letsencrypt"
      - "traefik.http.services.lehiboo-ai.loadbalancer.server.port=3000"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Réseau
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
networks:
  lehiboo-network:
    driver: bridge

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Volumes
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  logs:
    driver: local
  postgres_data:
    driver: local
