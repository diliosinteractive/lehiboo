# ============================================================
# Nginx Reverse Proxy - Configuration Securisee
# Pour Le Hiboo AI Backend
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================
    # Logging securise
    # ============================================================
    log_format secure '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log secure;

    # ============================================================
    # Performance
    # ============================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;

    # ============================================================
    # Securite - Headers globaux
    # ============================================================
    server_tokens off;

    # Limiter la taille des requetes
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # ============================================================
    # Rate Limiting
    # ============================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ============================================================
    # Upstream - Backend Node.js
    # ============================================================
    upstream backend {
        server backend:3000;
        keepalive 32;
    }

    # ============================================================
    # Serveur Principal
    # ============================================================
    server {
        listen 80;
        server_name _;

        # Headers de securite
        include /etc/nginx/security-headers.conf;

        # ============================================================
        # Blocage des bots et scanners
        # ============================================================
        if ($http_user_agent ~* (sqlmap|nikto|scan|bot|crawl|spider|nmap|masscan)) {
            return 444;
        }

        # Bloquer les methodes non autorisees
        if ($request_method !~ ^(GET|POST|OPTIONS)$) {
            return 405;
        }

        # ============================================================
        # Health Check (pas de rate limiting)
        # ============================================================
        location /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # ============================================================
        # API Chat - Rate limite strict
        # ============================================================
        location /chat {
            # Rate limiting: 2 requetes/seconde, burst de 5
            limit_req zone=chat_limit burst=5 nodelay;
            limit_conn conn_limit 5;

            proxy_pass http://backend/chat;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts pour les requetes AI (peuvent etre longues)
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
        }

        # ============================================================
        # API Mobile
        # ============================================================
        location /mobile {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://backend/mobile;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_read_timeout 60s;
        }

        # ============================================================
        # Autres routes API
        # ============================================================
        location / {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ============================================================
        # Bloquer l'acces aux fichiers sensibles
        # ============================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.(env|git|sql|bak|old|backup)$ {
            deny all;
        }

        # ============================================================
        # Page d'erreur personnalisee
        # ============================================================
        error_page 429 /429.json;
        location = /429.json {
            internal;
            default_type application/json;
            return 429 '{"success":false,"error":"Too many requests. Please slow down."}';
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 500 '{"success":false,"error":"Internal server error"}';
        }
    }
}
