# ============================================================
# Headers de Securite HTTP
# A inclure dans la configuration Nginx
# ============================================================

# Prevenir le clickjacking
add_header X-Frame-Options "DENY" always;

# Prevenir le MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Protection XSS (navigateurs modernes)
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy (CSP) - API uniquement
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

# Permissions Policy (anciennement Feature-Policy)
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# HSTS - A activer uniquement si HTTPS
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Cacher les informations du serveur
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
